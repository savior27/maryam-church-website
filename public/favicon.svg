<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cross-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C6A15B"/>
      <stop offset="100%" style="stop-color:#a8873d"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#641E2B"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#C6A15B" stroke-width="1.5"/>
  <!-- Ethiopian Cross -->
  <rect x="29" y="10" width="6" height="44" rx="1" fill="url(#cross-grad)"/>
  <rect x="14" y="22" width="36" height="6" rx="1" fill="url(#cross-grad)"/>
  <!-- Cross decorative ends -->
  <rect x="12" y="20" width="6" height="10" rx="1" fill="url(#cross-grad)"/>
  <rect x="46" y="20" width="6" height="10" rx="1" fill="url(#cross-grad)"/>
  <rect x="27" y="8" width="10" height="6" rx="1" fill="url(#cross-grad)"/>
  <rect x="27" y="50" width="10" height="6" rx="1" fill="url(#cross-grad)"/>
</svg>